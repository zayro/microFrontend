server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Endpoint simple para el healthcheck del contenedor.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Agrega la barra final para mantener consistentes las rutas base de Vite.
    location = /web/login {
        return 301 /web/login/;
    }

    # Sirve los archivos existentes y usa index.html como fallback para las
    # rutas internas de la SPA.
    location ^~ /web/login/ {
        try_files $uri $uri/ /web/login/index.html;
    }

    # Redirige a la ruta base con barra final y resuelve las rutas de la SPA HV.
    location = /web/frontHv {
        return 301 /web/frontHv/;
    }

    location ^~ /web/frontHv/ {
        try_files $uri $uri/ /web/frontHv/index.html;
    }

    # Mantiene el mismo comportamiento para la aplicacion de firma.
    location = /web/frontfirma {
        return 301 /web/frontfirma/;
    }

    location ^~ /web/frontfirma/ {
        try_files $uri $uri/ /web/frontfirma/index.html;
    }
}

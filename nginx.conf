server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /web/login {
        return 301 /web/login/;
    }

    location ^~ /web/login/ {
        try_files $uri $uri/ /web/login/index.html;
    }

    location = /web/frontHv {
        return 301 /web/frontHv/;
    }

    location ^~ /web/frontHv/ {
        try_files $uri $uri/ /web/frontHv/index.html;
    }
}
